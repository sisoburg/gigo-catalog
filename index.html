<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <title>Gigo — Jewelry Catalog</title>
    <meta property="og:title" content="Gigo" />
    <meta property="og:description" content="A private jewelry catalog." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Temporary: all three Stage-1 font-pairing candidates loaded at once
         for side-by-side review. Trim to the chosen pairing once picked. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600&family=David+Libre:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Heebo:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- SPA deep-link restore for GitHub Pages: 404.html stashes the real
         path in sessionStorage and bounces to "/"; this reads it back before
         React Router ever mounts. See public/404.html. -->
    <script>
      ;(function () {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
